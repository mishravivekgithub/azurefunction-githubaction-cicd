# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Ci-CD process

on:
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: carnival-azurefunction-demo # set this to your function app name on Azure
  PACKAGE_DIRECTORY: '.' # set this to the directory which contains pom.xml file
  JAVA_VERSION: '8' # set this to the java version to use

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup Java Sdk ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v1
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: 'Restore Project Dependencies Using Mvn'
        shell: bash
        run: |
          pushd './${{ env.PACKAGE_DIRECTORY }}'
          mvn clean package
          popd
  
  deply-to-qa:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E1D50E09D63A4C5B938D40DC44582D16 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3262FF5B28194EADBA1204ADF9B024E0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5C369E684D434F07A73A1C60908E4497 }}
          auth-type: service-principal

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'carnival-azurefunction-demo'
          slot-name: 'qa'
          package: '${{ env.PACKAGE_DIRECTORY }}'
          respect-pom-xml: true
          